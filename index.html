<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div class="image-section">
            <div class="logo-background">
                <img src="./assets/images/odin-lined.png" alt="logo">
                <h2>ODIN</h2>
            </div>
            <img class="image-background" src="./assets/images/halie-west-25xggax4bSA-unsplash.jpg"
                alt="image-background">
        </div>
        <div class="form-section">
            <p>This is not a real online service! You know you need something <br>
                like this in your life to help you realize your deepest dreams. <br>
                Sign up <em>now</em> to get started.</p>
            <p>You <em>know</em> you want to.</p>

            <form action="#" method="get">
                <div class="form-area">
                    <h2>Let's do this!</h2>
                    <div class="form-container">
                        <div class="form-group">
                            <div class="first-name section">
                                <label for="fname">first name:</label>
                                <input type="text" id="fname" name="fname" required>
                            </div>
                            <div class="last-name section">
                                <label for="lname">last name:</label>
                                <input type="text" name="lname" id="lname" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="user-email section">
                                <label for="email">email:</label>
                                <input type="email" name="email" id="email" required>
                            </div>
                            <div class="contact-number section">
                                <label for="contact-number">phone number:</label>
                                <input type="tel" id="contact-number" name="contact-number" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="pwd section">
                                <label for="pwd">password:</label>
                                <input type="password" id="pwd" name="password" required>
                            </div>
                            <div class="comfirm-pwd section">
                                <label for="comfirm-pwd">comfirm password:</label>
                                <input type="password" name="comfirm-password" id="comfirm-pwd" required>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="submit">Create Account</button>
                <p>Already have a account? <a href="#">Log in</a></p>
            </form>
        </div>
    </div>
</body>

</html>
